services:
  - type: web
    name: vivashield-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OLLAMA_HOST
        value: http://localhost:11434
    plan: free
